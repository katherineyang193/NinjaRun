<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../ui/style.css"><body data-mode="guided" data-prompt-size="LARGE"><div class="topbar">提示版型測試 · 合成狀態 · CAMERA OFF · 本頁只預覽圖示，不辨識動作 <button id="next">下一個狀態</button></div><div class="dojo"><section id="promptStage" class="prompt-stage"><div class="prompt-phase"></div><div class="prompt-symbol"></div><div class="prompt-label"></div><div class="prompt-combo"></div><div class="next-row">接下來<div class="prompt-next"></div></div></section></div><script type="module">import {PromptView} from '../ui/PromptView.js';let n=0;const view=new PromptView(document.querySelector('#promptStage'));const states=['PREVIEW','ACTIVE','SUCCESS','MISS'];const actions=['RUN','JUMP','CROUCH','DODGE_LEFT','DODGE_RIGHT'];function draw(){view.update({promptState:states[n%4],currentPrompt:actions[Math.floor(n/4)%5],nextPrompt:['DODGE_LEFT','CROUCH'],combo:3});}document.querySelector('#next').onclick=()=>{n++;draw();};draw();</script></body></html>
